services:
  api:
    build: .
    env_file: .env
    environment:
      AURA_DB_PATH: /app/data_runtime/aura.db
    ports:
      - "8010:8010"
    volumes:
      - aura_runtime:/app/data_runtime
    command: uvicorn app.main:app --host 0.0.0.0 --port 8010
  ui:
    build: .
    env_file: .env
    environment:
      AURA_API_URL: http://api:8010
    ports:
      - "8501:8501"
    depends_on:
      - api
    command: streamlit run streamlit_app/app.py --server.address 0.0.0.0 --server.port 8501
volumes:
  aura_runtime:
